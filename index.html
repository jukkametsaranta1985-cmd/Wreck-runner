<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wreck Runner</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#151b16;font-family:Arial;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:fixed;top:12px;left:12px;right:12px;color:white;font-weight:bold;display:flex;justify-content:space-between;text-shadow:2px 2px #000;pointer-events:none}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009}.box{background:#171714;border:2px solid #777;border-radius:16px;padding:28px;width:80%;max-width:400px;color:white;text-align:center}button{width:100%;padding:15px;background:#e7a029;border:0;border-radius:10px;font-size:20px;font-weight:bold}#touch{position:fixed;bottom:0;width:100%;height:32%;display:flex}#touch>*{flex:1}.jump{position:absolute;left:40%;right:40%;bottom:15px;height:70px;border:2px solid #fff4;border-radius:50%}.hide{display:none!important}</style></head><body><canvas id="c"></canvas><div id="ui"><span id="d">MATKA 0 m</span><span id="s">⚙ 0</span></div><div id="menu" class="panel"><div class="box"><h1>WRECK<br><span style="color:#e7a029">RUNNER</span></h1><p>RUN. JUMP. SURVIVE.</p><p>Kerää romua ja tee uusi ennätys.</p><button id="start">PELAA</button></div></div><div id="over" class="panel hide"><div class="box"><h1>RUN OVER</h1><p id="result"></p><button id="again">YRITÄ UUDELLEEN</button></div></div><div id="touch"><div id="l"></div><div class="jump" id="j"></div><div id="r"></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,run=false,last=0,world=0,score=0,best=+localStorage.wrbest||0,speed=330,p,ps,coins,obs,keys={};
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=resize;resize();
function reset(){p={x:Math.max(60,W*.18),y:H-150,w:40,h:58,vy:0,vx:0,on:0};ps=[{x:-200,y:H-70,w:900,h:25}];coins=[];obs=[];world=score=0;speed=330;run=true;menu.classList.add('hide');over.classList.add('hide');while(ps.at(-1).x<world+W+800)spawn()}
function spawn(){let q=ps.at(-1),gap=45+Math.random()*80,y=Math.max(150,H-100-Math.random()*180),w=160+Math.random()*220,x=q.x+q.w+gap;ps.push({x,y,w,h:25});if(Math.random()<.9)coins.push({x:x+w*.45,y:y-30});if(Math.random()<.3)obs.push({x:x+w*.7,y:y-30,w:30,h:30})}
function jump(){if(run&&p.on){p.vy=-750;p.on=0}}
function die(){if(!run)return;run=false;best=Math.max(best,score);localStorage.wrbest=best;result.textContent='Matka '+Math.floor(world/10)+' m • romu '+score+' • ennätys '+best;over.classList.remove('hide')}
function update(dt){if(!run)return;speed=Math.min(700,speed+dt*4);world+=speed*dt;while(ps.at(-1).x<world+W+800)spawn();p.vy+=1900*dt;p.y+=p.vy*dt;let t=(keys.r?220:0)-(keys.l?220:0);p.vx+=(t-p.vx)*Math.min(1,dt*8);p.x+=p.vx*dt;p.x=Math.max(10,Math.min(W-55,p.x));p.on=0;for(let q of ps){let x=q.x-world;if(p.x+p.w>x&&p.x<x+q.w&&p.y+p.h<=q.y+14&&p.y+p.h+p.vy*dt>=q.y){p.y=q.y-p.h;p.vy=0;p.on=1}}for(let i=coins.length-1;i>=0;i--){let q=coins[i],x=q.x-world;if(Math.hypot(p.x+20-x,p.y+25-q.y)<32){score++;coins.splice(i,1)}}for(let q of obs){let x=q.x-world;if(p.x<x+q.w&&p.x+p.w>x&&p.y<q.y+q.h&&p.y+p.h>q.y)die()}if(p.y>H+100)die()}
function draw(){let z=g.createLinearGradient(0,0,0,H);z.addColorStop(0,'#162018');z.addColorStop(1,'#765f3e');g.fillStyle=z;g.fillRect(0,0,W,H);g.fillStyle='#293329';for(let i=0;i<18;i++){let x=((i*150-world*.12)%(W+180))-90;g.fillRect(x,H-170-(i%4)*35,70,170+(i%4)*35)}for(let q of ps){let x=q.x-world;if(x>-400&&x<W+400){g.fillStyle='#5b5b51';g.fillRect(x,q.y,q.w,q.h);g.fillStyle='#ad8950';g.fillRect(x,q.y,q.w,5)}}for(let q of coins){let x=q.x-world;g.fillStyle='#e9a32b';g.beginPath();g.arc(x,q.y,10,0,7);g.fill()}for(let q of obs){let x=q.x-world;g.fillStyle='#bd3b28';g.fillRect(x,q.y,q.w,q.h)}let x=p.x,y=p.y;g.fillStyle='#27384b';g.fillRect(x+7,y+37,12,21);g.fillRect(x+23,y+37,12,21);g.fillStyle='#171717';g.fillRect(x+3,y+54,19,8);g.fillRect(x+22,y+54,20,8);g.fillStyle='#171717';g.fillRect(x+5,y+16,31,29);g.fillStyle='#b97959';g.fillRect(x-5,y+19,10,27);g.fillRect(x+36,y+18,10,27);g.beginPath();g.arc(x+20,y+7,14,0,7);g.fill();g.fillStyle='#40332e';g.beginPath();g.arc(x+20,y+11,10,0,Math.PI);g.fill();g.fillStyle='#e57b9b';g.fillRect(x+6,y-3,29,8);g.beginPath();g.arc(x+20,y-2,13,Math.PI,0);g.fill();g.fillRect(x+28,y+2,12,4);g.fillStyle='#eee';g.font='bold 6px Arial';g.fillText('WRECK',x+9,y+29);g.fillText('RUNNER',x+8,y+36);d.textContent='MATKA '+Math.floor(world/10)+' m';s.textContent='⚙ '+score}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
start.onclick=reset;again.onclick=reset;addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp')jump();if(e.key==='ArrowLeft')keys.l=1;if(e.key==='ArrowRight')keys.r=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=0;if(e.key==='ArrowRight')keys.r=0});function bind(id,k){let e=document.getElementById(id);e.onpointerdown=()=>keys[k]=1;e.onpointerup=e.onpointercancel=()=>keys[k]=0}bind('l','l');bind('r','r');j.onpointerdown=jump;
</script></body></html>
