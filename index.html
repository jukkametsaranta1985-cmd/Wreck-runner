<!doctype html><html lang='fi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>Wreck Runner 0.2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111813;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:900;font-size:18px;text-shadow:2px 2px #000;pointer-events:none}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:5}.card{width:min(430px,90vw);padding:26px;border:2px solid #777;border-radius:18px;background:linear-gradient(#292923,#111);color:#fff;text-align:center}h1{font-size:48px;line-height:.9;margin:0}h1 span{color:#e9a129}button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:10px;background:#e9a129;font-size:20px;font-weight:900}.hidden{display:none!important}#touch{position:fixed;inset:0;pointer-events:none}#left,#right,#jump{position:absolute;bottom:0;height:38vh;pointer-events:auto}#left{left:0;width:30%}#right{right:0;width:30%}#jump{left:30%;width:40%}#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;border:3px solid #fff4}</style></head><body><canvas id='game'></canvas><div id='hud'><span id='distance'>MATKA 0 m</span><span id='scrap'>⚙ 0</span></div><div id='menu' class='overlay'><div class='card'><h1>WRECK<br><span>RUNNER</span></h1><p>RUN. JUMP. SURVIVE.</p><p>Kerää romua, väistä esteitä ja tee uusi ennätys.</p><button id='startBtn'>PELAA</button><p>Puhelin: keskeltä hyppy, alareunan reunat ohjaavat.</p></div></div><div id='gameover' class='overlay hidden'><div class='card'><h1>RUN<br><span>OVER</span></h1><p id='result'></p><button id='againBtn'>YRITÄ UUDELLEEN</button></div></div><div id='touch'><div id='left'></div><div id='jump'></div><div id='right'></div></div><div id='hint'></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),gameover=document.getElementById('gameover'),distanceEl=document.getElementById('distance'),scrapEl=document.getElementById('scrap');let W,H,DPR,last=0,state='menu',world=0,score=0,best=+localStorage.wreckBest||0,speed=330,p,plats=[],items=[],obs=[],keys={left:false,right:false};
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function spawn(){let q=plats.at(-1),gap=45+Math.random()*85,y=Math.max(140,H-100-Math.random()*170),w=160+Math.random()*230,x=q.x+q.w+gap;plats.push({x,y,w,h:25});if(Math.random()<.9)items.push({x:x+w*.45,y:y-30});if(Math.random()<.32)obs.push({x:x+w*.72,y:y-30,w:30,h:30})}
function reset(){p={x:Math.max(70,W*.18),y:H-160,w:42,h:60,vy:0,vx:0,on:false};plats=[{x:-250,y:H-75,w:950,h:25}];items=[];obs=[];world=0;score=0;speed=330;state='play';menu.classList.add('hidden');gameover.classList.add('hidden');while(plats.at(-1).x<world+W+900)spawn()}
function jump(){if(state==='play'&&p.on){p.vy=-760;p.on=false}}
function die(){if(state!=='play')return;state='over';best=Math.max(best,score);localStorage.wreckBest=best;result.textContent='Matka '+Math.floor(world/10)+' m • romu '+score+' • ennätys '+best;gameover.classList.remove('hidden')}
function update(dt){if(state!=='play')return;speed=Math.min(700,speed+dt*4);world+=speed*dt;while(plats.at(-1).x<world+W+800)spawn();p.vy+=1900*dt;p.y+=p.vy*dt;let target=(keys.right?220:0)-(keys.left?220:0);p.vx+=(target-p.vx)*Math.min(1,dt*8);p.x+=p.vx*dt;p.x=Math.max(15,Math.min(W-p.w-15,p.x));p.on=false;for(const q of plats){let sx=q.x-world;if(p.x+p.w>sx&&p.x<sx+q.w&&p.y+p.h<=q.y+14&&p.y+p.h+p.vy*dt>=q.y){p.y=q.y-p.h;p.vy=0;p.on=true}}for(let i=items.length-1;i>=0;i--){let q=items[i],sx=q.x-world;if(Math.hypot(p.x+21-sx,p.y+28-q.y)<34){score++;items.splice(i,1)}}for(const q of obs){let sx=q.x-world;if(p.x<sx+q.w&&p.x+p.w>sx&&p.y<q.y+q.h&&p.y+p.h>q.y)die()}if(p.y>H+100)die()}
function drawPlayer(){if(!p)return;let x=p.x,y=p.y;ctx.fillStyle='#2d4054';ctx.fillRect(x+8,y+38,12,22);ctx.fillRect(x+24,y+38,12,22);ctx.fillStyle='#171717';ctx.fillRect(x+2,y+56,20,8);ctx.fillRect(x+23,y+56,21,8);ctx.fillStyle='#151515';ctx.fillRect(x+6,y+17,32,31);ctx.fillStyle='#bb7d5c';ctx.fillRect(x-5,y+20,11,28);ctx.fillRect(x+38,y+18,11,28);ctx.fillStyle='#49372f';ctx.beginPath();ctx.arc(x+22,y+12,11,0,Math.PI);ctx.fill();ctx.fillStyle='#bd7d5d';ctx.beginPath();ctx.arc(x+22,y+7,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e57da0';ctx.fillRect(x+8,y-4,29,8);ctx.beginPath();ctx.arc(x+22,y-3,13,Math.PI,0);ctx.fill();ctx.fillRect(x+30,y+1,13,4);ctx.fillStyle='#eee';ctx.font='bold 6px Arial';ctx.fillText('WRECK',x+11,y+30);ctx.fillText('RUNNER',x+9,y+37)}
function draw(){let gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#17221a');gr.addColorStop(1,'#6c5839');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.fillStyle='#2a3229';for(let i=0;i<18;i++){let sx=((i*170-world*.12)%(W+220))-110,hh=80+(i%5)*34;ctx.fillRect(sx,H-110-hh,80,hh+110)}for(const q of plats){let sx=q.x-world;if(sx>-400&&sx<W+400){ctx.fillStyle='#5d5b50';ctx.fillRect(sx,q.y,q.w,q.h);ctx.fillStyle='#b18d53';ctx.fillRect(sx,q.y,q.w,5)}}for(const q of items){let sx=q.x-world;ctx.fillStyle='#e7a12c';ctx.beginPath();ctx.arc(sx,q.y,10,0,Math.PI*2);ctx.fill()}for(const q of obs){let sx=q.x-world;ctx.fillStyle='#b83a2c';ctx.fillRect(sx,q.y,q.w,q.h)}drawPlayer();distanceEl.textContent='MATKA '+Math.floor(world/10)+' m';scrapEl.textContent='⚙ '+score}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
startBtn.onclick=reset;againBtn.onclick=reset;addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function bind(id,key){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,e=>{e.preventDefault();keys[key]=false}))}bind('left','left');bind('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
</script></body></html>
