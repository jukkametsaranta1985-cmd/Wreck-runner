<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1510">
<title>Wreck Runner 0.6</title>
<style>
:root{--orange:#e7a02b;--green:#7fa23a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1510;font-family:Arial,Helvetica,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:6;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:9px;color:#fff;font-weight:900;text-shadow:2px 2px 3px #000;pointer-events:none}
.badge{background:#0008;border:1px solid #ffffff20;border-radius:10px;padding:6px 9px}.grow{flex:1}
#pauseBtn{pointer-events:auto;border:1px solid #ffffff40;background:#111b;color:#fff;border-radius:9px;padding:6px 10px;font-size:18px}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#000b;padding:12px}
.hidden{display:none!important}
.card{width:min(480px,94vw);max-height:94vh;overflow:auto;background:linear-gradient(#2b2a24,#11110f);border:2px solid #77705f;border-radius:18px;color:#fff;box-shadow:0 18px 70px #000}
.cover{height:min(45vh,390px);position:relative;overflow:hidden;background:#111}
.cover img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#111)}
.logo{position:absolute;left:16px;bottom:17px;z-index:2;text-align:left;font-size:40px;line-height:.84;font-weight:900;text-shadow:3px 3px #000;letter-spacing:1px}
.logo span{color:var(--orange)}.body{padding:16px 18px 20px;text-align:center}
button{border:0;border-radius:10px;padding:13px 14px;font-size:18px;font-weight:900}
.primary{width:100%;background:var(--orange);color:#111}.secondary{width:100%;margin-top:8px;background:#45443d;color:#fff}
.small{font-size:12px;color:#bbb}
#shopGrid{display:grid;gap:8px;margin-top:10px}
.upgrade{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;text-align:left;padding:10px;background:#0d0d0bcc;border:1px solid #ffffff16;border-radius:10px}
.upgrade b{display:block}.upgrade small{color:#aaa}.buy{background:var(--green);color:#111;padding:9px 10px;font-size:14px}.buy:disabled{opacity:.42}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}.zone{position:absolute;bottom:0;height:38vh;pointer-events:auto}
#left{left:0;width:28%}#right{right:0;width:28%}#jump{left:28%;width:44%}
#jumpHint{position:fixed;left:50%;bottom:max(17px,env(safe-area-inset-bottom));transform:translateX(-50%);width:82px;height:82px;border-radius:50%;border:3px solid #fff3;background:#fff1;z-index:3;pointer-events:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:20;background:#111e;color:#fff;padding:9px 13px;border-radius:9px;font-weight:bold;opacity:0;transition:.2s}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <span id="distance" class="badge">MATKA 0 m</span>
  <span id="jumpHud" class="badge hidden">↟↟</span>
  <span id="shieldHud" class="badge hidden">🛡️</span>
  <span class="grow"></span>
  <span id="runScrap" class="badge">⚙ 0</span>
  <button id="pauseBtn">Ⅱ</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <div class="cover"><img src="wreck_runner_cover.jpg" alt="Wreck Runner"><div class="logo">WRECK<br><span>RUNNER</span></div></div>
    <div class="body">
      <button id="startBtn" class="primary">PELAA</button>
      <button id="shopBtn" class="secondary">UPGRADET • ⚙ <span id="walletMenu">0</span></button>
      <p class="small">Keskeltä hyppy • reunat ohjaavat • tuplahyppy ostettavissa upgradeista</p>
    </div>
  </div>
</div>

<div id="shop" class="overlay hidden">
  <div class="card"><div class="body">
    <h2 style="margin-top:0">UPGRADET</h2>
    <p>Romupankki: ⚙ <b id="walletShop">0</b></p>
    <div id="shopGrid"></div>
    <button id="shopBack" class="secondary">TAKAISIN</button>
  </div></div>
</div>

<div id="over" class="overlay hidden">
  <div class="card"><div class="body">
    <h1 style="margin:0;font-size:44px">RUN <span style="color:var(--orange)">OVER</span></h1>
    <p id="result"></p>
    <button id="againBtn" class="primary">YRITÄ UUDELLEEN</button>
    <button id="overShopBtn" class="secondary">UPGRADET</button>
    <button id="menuBtn" class="secondary">VALIKKOON</button>
  </div></div>
</div>

<div id="paused" class="overlay hidden">
  <div class="card"><div class="body"><h2>TAUKO</h2><button id="resumeBtn" class="primary">JATKA</button><button id="pauseMenuBtn" class="secondary">VALIKKOON</button></div></div>
</div>

<div id="touch"><div id="left" class="zone"></div><div id="jump" class="zone"></div><div id="right" class="zone"></div></div>
<div id="jumpHint"></div><div id="toast"></div>

<script>
(() => {
const $=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');
let W=0,H=0,DPR=1,last=0,state='menu',world=0,speed=285,runScrap=0,startGrace=0,shake=0;
let p=null,plats=[],items=[],hazards=[],drones=[],powers=[],particles=[],debris=[],keys={left:false,right:false};

const save=JSON.parse(localStorage.getItem('wreckRunner06')||'{}');
let wallet=save.wallet||0,best=save.best||0;
let upgrades=Object.assign({magnet:0,shield:0,value:0,jump:0,double:0},save.upgrades||{});
const UPG={
 magnet:{name:'MAGNEETTI',desc:'Vetää romua kauempaa.',base:50,max:4},
 shield:{name:'KILPI',desc:'Aloita juoksu yhdellä suojalla.',base:80,max:3},
 value:{name:'ROMUN ARVO',desc:'Kerätty romu on arvokkaampaa.',base:100,max:5},
 jump:{name:'JOUSTOSAAPPAAT',desc:'Hyppy nousee korkeammalle.',base:70,max:4},
 double:{name:'TUPLAHYPPY',desc:'Mahdollistaa toisen hypyn ilmassa.',base:180,max:1}
};
function persist(){localStorage.setItem('wreckRunner06',JSON.stringify({wallet,best,upgrades}))}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
function audio(freq=300,d=.05,type='square',vol=.025){try{const A=audio.ctx||(audio.ctx=new (AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1200)}
function hideAll(){['menu','shop','over','paused'].forEach(id=>$(id).classList.add('hidden'))}
function bank(){wallet+=runScrap*(1+upgrades.value);persist()}

function reset(){
  world=0;speed=285;runScrap=0;startGrace=2.5;shake=0;
  p={x:Math.max(85,W*.18),y:H-165,w:46,h:66,vy:0,vx:0,on:false,anim:0,shield:upgrades.shield>0?1:0,jumpsUsed:0};
  // Safe starter ground: about 350 m before first real gap.
  const starter=3800;
  plats=[{x:-700,y:H-78,w:starter,h:28,start:true}];
  items=[];hazards=[];drones=[];powers=[];particles=[];debris=[];
  for(let i=0;i<14;i++)items.push({x:420+i*145,y:H-120,r:11});
  // Decorative junk on starter section, not deadly.
  for(let i=0;i<12;i++)debris.push({x:700+i*240,y:H-104,type:i%3});
  while(plats.at(-1).x+plats.at(-1).w<W+4200)spawnChunk();
  state='play';hideAll();$('shieldHud').classList.toggle('hidden',!p.shield);$('jumpHud').classList.toggle('hidden',!upgrades.double);
}
function spawnChunk(){
  const q=plats.at(-1),gap=55+Math.random()*92,y=Math.max(145,H-105-Math.random()*170),w=190+Math.random()*300,x=q.x+q.w+gap;
  plats.push({x,y,w,h:27});
  const n=1+(Math.random()<.45?1:0);
  for(let i=0;i<n;i++)if(Math.random()<.95)items.push({x:x+w*(.34+i*.24),y:y-34,r:11});
  if(Math.random()<.34)hazards.push({x:x+w*.70,y:y-35,w:35,h:35,type:Math.random()<.55?'barrel':'spikes'});
  if(Math.random()<.17&&world>1800)drones.push({x:x+w*.55,y:y-90,w:44,h:25,phase:Math.random()*6.28});
  if(Math.random()<.08)powers.push({x:x+w*.48,y:y-58,type:Math.random()<.5?'shield':'boost'});
}
function jump(){
  if(state!=='play'||!p)return;
  if(p.on){p.vy=-(760+upgrades.jump*28);p.on=false;p.jumpsUsed=1;burst(p.x+22,p.y+p.h,8,'#c9b58a');audio(220,.07)}
  else if(upgrades.double && p.jumpsUsed<2){p.vy=-(690+upgrades.jump*20);p.jumpsUsed=2;burst(p.x+22,p.y+40,12,'#e7a02b');audio(350,.08,'square',.03);toast('TUPLAHYPPY!')}
}
function burst(x,y,n,color='#e7a02b'){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:-Math.random()*190,life:.52,color})}
function hit(){if(p.shield){p.shield=0;$('shieldHud').classList.add('hidden');shake=12;toast('KILPI PELASTI!');audio(110,.18,'sawtooth',.035);return}end()}
function end(){if(state!=='play')return;state='over';best=Math.max(best,Math.floor(world/10));bank();$('result').innerHTML=`Matka <b>${Math.floor(world/10)} m</b><br>Keräsit ⚙ ${runScrap} → pankkiin ⚙ ${runScrap*(1+upgrades.value)}<br>Ennätys ${best} m`;updateWallet();$('over').classList.remove('hidden');audio(90,.35,'sawtooth',.035)}
function update(dt){
 if(state!=='play'||!p)return;p.anim+=dt*12;
 if(startGrace>0)startGrace-=dt;else{speed=Math.min(760,speed+dt*4.8);world+=speed*dt}
 while(plats.at(-1).x+plats.at(-1).w<world+W+1700)spawnChunk();
 p.vy+=1900*dt;p.y+=p.vy*dt;
 const target=(keys.right?245:0)-(keys.left?245:0);p.vx+=(target-p.vx)*Math.min(1,dt*9);p.x+=p.vx*dt;p.x=Math.max(18,Math.min(W-p.w-18,p.x));p.on=false;
 for(const q of plats){const sx=q.x-world;if(p.x+p.w>sx&&p.x<sx+q.w&&p.y+p.h<=q.y+15&&p.y+p.h+p.vy*dt>=q.y){p.y=q.y-p.h;p.vy=0;p.on=true;p.jumpsUsed=0}}
 const magnet=36+upgrades.magnet*36;
 for(let i=items.length-1;i>=0;i--){const q=items[i],sx=q.x-world,dx=p.x+23-sx,dy=p.y+30-q.y,dist=Math.hypot(dx,dy);if(dist<magnet&&dist>1){q.x+=dx/dist*230*dt;q.y+=dy/dist*230*dt}if(dist<35){runScrap++;items.splice(i,1);burst(sx,q.y,9);audio(680,.045,'square',.018)}}
 for(const q of hazards){const sx=q.x-world;if(p.x<sx+q.w&&p.x+p.w>sx&&p.y<q.y+q.h&&p.y+p.h>q.y){q.x=-999999;hit()}}
 for(const q of drones){q.phase+=dt*3;q.y+=Math.sin(q.phase)*18*dt;const sx=q.x-world;if(p.x<sx+q.w&&p.x+p.w>sx&&p.y<q.y+q.h&&p.y+p.h>q.y){q.x=-999999;hit()}}
 for(let i=powers.length-1;i>=0;i--){const q=powers[i],sx=q.x-world;if(Math.hypot(p.x+23-sx,p.y+28-q.y)<38){if(q.type==='shield'){p.shield=1;$('shieldHud').classList.remove('hidden');toast('KILPI!')}else{world+=120;toast('BOOST!')}powers.splice(i,1);audio(900,.12,'sine',.025)}}
 if(p.y>H+110)end();
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=560*dt;if(q.life<=0)particles.splice(i,1)}
 shake=Math.max(0,shake-dt*35);
}
function rr(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill()}
function background(){
 const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#141f19');gr.addColorStop(.48,'#3d4030');gr.addColorStop(1,'#7b5b39');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 // sun haze
 ctx.fillStyle='rgba(245,196,116,.10)';ctx.beginPath();ctx.arc(W*.77,H*.18,Math.min(W,H)*.17,0,7);ctx.fill();
 // far mountains
 ctx.fillStyle='#2c352c';ctx.beginPath();ctx.moveTo(0,H*.68);for(let i=0;i<=8;i++){let xx=i*W/8,yy=H*.58-(i%2)*H*.08;ctx.lineTo(xx,yy)}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 // city
 ctx.fillStyle='#202821';for(let i=0;i<22;i++){const sx=((i*150-world*.095)%(W+220))-100,hh=70+(i%6)*30;ctx.fillRect(sx,H-120-hh,78,hh+120);if(i%4===0){ctx.fillStyle='#7a4a27';ctx.fillRect(sx+16,H-120-hh+20,7,4);ctx.fillStyle='#202821'}}
 // cranes
 ctx.strokeStyle='#1d231e';ctx.lineWidth=4;for(let i=0;i<5;i++){const sx=((i*360-world*.055)%(W+520))-100;ctx.beginPath();ctx.moveTo(sx,H-150);ctx.lineTo(sx,H-355);ctx.lineTo(sx+120,H-355);ctx.stroke();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx+100,H-355);ctx.lineTo(sx+100,H-285);ctx.stroke();ctx.lineWidth=4}
 // smoke
 ctx.fillStyle='rgba(13,13,13,.27)';for(let i=0;i<6;i++){const sx=((i*270-world*.04)%(W+360))-120;ctx.beginPath();ctx.arc(sx,H-285,34,0,7);ctx.arc(sx+30,H-330,49,0,7);ctx.fill()}
}
function platform(q){const sx=q.x-world;if(sx<-600||sx>W+600)return;ctx.fillStyle=q.start?'#3c3931':'#514d42';ctx.fillRect(sx,q.y,q.w,q.h);ctx.fillStyle='#b78a4d';ctx.fillRect(sx,q.y,q.w,5);ctx.fillStyle='#24241f';for(let xx=sx+14;xx<sx+q.w-12;xx+=42){ctx.fillRect(xx,q.y+12,19,5);ctx.fillRect(xx+7,q.y+20,4,4)}ctx.fillStyle='#1f221f';ctx.fillRect(sx,q.y+q.h, q.w, Math.max(0,H-q.y-q.h))}
function gear(x,y,r){ctx.save();ctx.translate(x,y);ctx.shadowColor='#f0b64c';ctx.shadowBlur=8;ctx.fillStyle='#e7a02b';for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(r*.72,-3,r*.40,6)}ctx.beginPath();ctx.arc(0,0,r*.78,0,7);ctx.fill();ctx.fillStyle='#4a3b21';ctx.beginPath();ctx.arc(0,0,r*.3,0,7);ctx.fill();ctx.restore()}
function obstacle(q){const sx=q.x-world;if(q.type==='barrel'){rr(sx,q.y,q.w,q.h,5,'#9e3529');ctx.fillStyle='#e57a31';ctx.fillRect(sx+3,q.y+7,q.w-6,5);ctx.fillRect(sx+3,q.y+23,q.w-6,5);ctx.fillStyle='#20201d';ctx.fillRect(sx+14,q.y+3,7,q.h-6)}else{ctx.fillStyle='#d6c39f';for(let i=0;i<3;i++){const xx=sx+i*12;ctx.beginPath();ctx.moveTo(xx,q.y+q.h);ctx.lineTo(xx+6,q.y);ctx.lineTo(xx+12,q.y+q.h);ctx.fill()}}}
function drone(q){const sx=q.x-world;ctx.save();ctx.shadowColor='#b52720';ctx.shadowBlur=10;rr(sx,q.y,q.w,q.h,8,'#31342f');ctx.fillStyle='#a42f27';ctx.beginPath();ctx.arc(sx+10,q.y+12,5,0,7);ctx.fill();ctx.strokeStyle='#77786f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+8,q.y+2);ctx.lineTo(sx-7,q.y-7);ctx.moveTo(sx+35,q.y+2);ctx.lineTo(sx+50,q.y-7);ctx.stroke();ctx.restore()}
function power(q){const sx=q.x-world;ctx.save();ctx.shadowColor=q.type==='shield'?'#8ad6ff':'#ffd94b';ctx.shadowBlur=14;ctx.fillStyle=q.type==='shield'?'#77b8db':'#f1c234';ctx.beginPath();ctx.arc(sx,q.y,14,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px Arial';ctx.textAlign='center';ctx.fillText(q.type==='shield'?'S':'⚡',sx,q.y+5);ctx.textAlign='left';ctx.restore()}
function junk(q){const sx=q.x-world;if(sx<-100||sx>W+100)return;ctx.save();ctx.globalAlpha=.65;if(q.type===0){ctx.fillStyle='#5d2f27';ctx.fillRect(sx,q.y,52,18);ctx.fillStyle='#202020';ctx.beginPath();ctx.arc(sx+12,q.y+19,8,0,7);ctx.arc(sx+41,q.y+19,8,0,7);ctx.fill()}else if(q.type===1){ctx.fillStyle='#52554f';ctx.fillRect(sx,q.y,38,22);ctx.fillStyle='#222';ctx.fillRect(sx+4,q.y+4,30,4)}else{ctx.fillStyle='#3b3c38';ctx.beginPath();ctx.arc(sx+15,q.y+12,13,0,7);ctx.fill();ctx.strokeStyle='#777';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx+15,q.y+12,7,0,7);ctx.stroke()}ctx.restore()}
function player(){
 if(!p)return;const x=p.x,y=p.y,bob=p.on?Math.sin(p.anim)*1.8:0,swing=p.on?Math.sin(p.anim)*6:0;ctx.save();ctx.translate(0,bob);
 ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x+23,y+69,28,7,0,0,7);ctx.fill();
 ctx.strokeStyle='#2e4358';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+18,y+44);ctx.lineTo(x+15+swing,y+62);ctx.stroke();ctx.beginPath();ctx.moveTo(x+30,y+44);ctx.lineTo(x+33-swing,y+62);ctx.stroke();
 ctx.strokeStyle='#171717';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+11+swing,y+62);ctx.lineTo(x+21+swing,y+62);ctx.stroke();ctx.beginPath();ctx.moveTo(x+30-swing,y+62);ctx.lineTo(x+41-swing,y+62);ctx.stroke();
 rr(x+7,y+18,33,31,6,'#171717');
 ctx.strokeStyle='#b87959';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x+8,y+25);ctx.lineTo(x-2,y+40+swing*.35);ctx.stroke();ctx.beginPath();ctx.moveTo(x+38,y+24);ctx.lineTo(x+49,y+38-swing*.35);ctx.stroke();
 ctx.strokeStyle='#49352f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+1,y+31);ctx.lineTo(x-2,y+38);ctx.moveTo(x+44,y+29);ctx.lineTo(x+48,y+36);ctx.stroke();
 ctx.fillStyle='#bd7d5c';ctx.beginPath();ctx.arc(x+24,y+8,14,0,7);ctx.fill();
 ctx.fillStyle='#44332c';ctx.beginPath();ctx.moveTo(x+13,y+10);ctx.quadraticCurveTo(x+24,y+29,x+35,y+10);ctx.quadraticCurveTo(x+24,y+20,x+13,y+10);ctx.fill();
 ctx.fillStyle='#e77b9f';ctx.beginPath();ctx.arc(x+23,y-2,13,Math.PI,0);ctx.fill();ctx.fillRect(x+10,y-3,28,7);ctx.fillRect(x+32,y+1,13,4);
 ctx.fillStyle='#eee';ctx.font='bold 6px Arial';ctx.fillText('WRECK',x+12,y+31);ctx.fillText('RUNNER',x+10,y+38);
 if(p.shield){ctx.strokeStyle='#8bd2ff';ctx.lineWidth=3;ctx.globalAlpha=.55+.2*Math.sin(p.anim);ctx.beginPath();ctx.arc(x+23,y+31,38,0,7);ctx.stroke();ctx.globalAlpha=1}
 ctx.restore();
}
function draw(){
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 background();for(const q of plats)platform(q);for(const q of debris)junk(q);for(const q of items)gear(q.x-world,q.y,q.r);for(const q of hazards)obstacle(q);for(const q of drones)drone(q);for(const q of powers)power(q);player();
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,5,5);ctx.globalAlpha=1}
 ctx.restore();
 if(state==='play'&&startGrace>0){ctx.fillStyle='#fff';ctx.globalAlpha=.82;ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('VALMISTAUDU...',W/2,65);ctx.textAlign='left';ctx.globalAlpha=1}
 $('distance').textContent='MATKA '+Math.floor(world/10)+' m';$('runScrap').textContent='⚙ '+runScrap;
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);

function updateWallet(){$('walletMenu').textContent=wallet;$('walletShop').textContent=wallet}
function renderShop(){
 updateWallet();const grid=$('shopGrid');grid.innerHTML='';
 for(const [id,u] of Object.entries(UPG)){const lvl=upgrades[id],cost=u.base*(lvl+1),row=document.createElement('div');row.className='upgrade';row.innerHTML=`<div><b>${u.name} ${lvl}/${u.max}</b><small>${u.desc}</small></div>`;const b=document.createElement('button');b.className='buy';b.textContent=lvl>=u.max?'MAX':'⚙ '+cost;b.disabled=lvl>=u.max||wallet<cost;b.onclick=()=>{if(wallet>=cost&&upgrades[id]<u.max){wallet-=cost;upgrades[id]++;persist();renderShop();audio(520,.08);toast(id==='double'?'TUPLAHYPPY AVATTU!':'UPGRADE OSTETTU')}};row.appendChild(b);grid.appendChild(row)}
}
function openShop(){hideAll();renderShop();$('shop').classList.remove('hidden')}
$('startBtn').onclick=reset;$('againBtn').onclick=reset;$('shopBtn').onclick=openShop;$('overShopBtn').onclick=openShop;$('shopBack').onclick=()=>{hideAll();updateWallet();$('menu').classList.remove('hidden')};$('menuBtn').onclick=()=>{hideAll();updateWallet();$('menu').classList.remove('hidden')};
$('pauseBtn').onclick=()=>{if(state==='play'){state='paused';$('paused').classList.remove('hidden')}};$('resumeBtn').onclick=()=>{state='play';$('paused').classList.add('hidden');last=performance.now()};$('pauseMenuBtn').onclick=()=>{state='menu';hideAll();updateWallet();$('menu').classList.remove('hidden')};
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false});
function hold(id,key){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,e=>{e.preventDefault();keys[key]=false}))}hold('left','left');hold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
updateWallet();
})();
</script></body></html>
